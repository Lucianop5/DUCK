services:
  db:
    image: mysql:8.4
    container_name: gastos-hormiga-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gastos_hormiga}
      MYSQL_USER: ${MYSQL_USER:-gastos_hormiga}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gastos_hormiga_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_cambiar}
    ports:
      # 3307 en el host para convivir con el MySQL local en :3306.
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  mysql_data:
