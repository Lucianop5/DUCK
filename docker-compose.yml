services:
  db:
    image: postgres:18-alpine
    container_name: gastos-hormiga-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gastos_hormiga}
      POSTGRES_USER: ${POSTGRES_USER:-gastos_hormiga}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gastos_hormiga}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gastos_hormiga} -d ${POSTGRES_DB:-gastos_hormiga}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
